<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John Constantine | My Halloween Costume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    /* Black and red (background, cigarette, tally number, lines) */
    --ash: #000000;
    --newsprint: #ece8e8;
    --trench: #c8102e;
    --ember: #ff1f1f;
    --muted: #9a9a9a;
    --line: #2a2a2a;

    /* Original colors, kept for the title, buttons, tabs, Equipment and Who He Is */
    --o-ink: #1d1a17;
    --o-smoke: #2a2622;
    --o-newsprint: #e6dcc3;
    --o-trench: #b59a6a;
    --o-ember: #ff5a1f;
    --o-muted: #a39b88;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--ash);
    color: var(--newsprint);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 1.25rem;
    line-height: 1.7;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }

  /* Hero */
  .hero { padding: 72px 0 40px; }
  .hero h1 {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-weight: 400;
    font-size: clamp(3.2rem, 12vw, 7rem);
    line-height: 0.95;
    margin: 0 0 24px;
    letter-spacing: -1px;
    color: var(--o-newsprint);
  }
  .hero h1 span { display: block; color: var(--o-trench); }
  .hero p.tag { max-width: 34ch; font-size: 1.45rem; font-style: italic; color: var(--o-muted); margin: 0; }

  /* Cigarette: the one memorable moment */
  .cig { position: relative; display: flex; align-items: center; margin: 48px 0 0; height: 60px; }
  .cig .paper { flex: 0 0 min(60%, 420px); height: 12px; background: var(--newsprint); border-radius: 2px 0 0 2px; }
  .cig .filter { width: 70px; height: 12px; background: var(--trench); order: -1; border-radius: 2px 0 0 2px; }
  .cig .ember {
    width: 14px; height: 12px; border-radius: 0 3px 3px 0;
    background: var(--ember);
    box-shadow: 0 0 14px 4px rgba(255, 31, 31, .7);
    animation: glow 3.2s ease-in-out infinite;
  }
  .cig .smoke { position: absolute; right: calc(100% - min(60%, 420px) - 84px); bottom: 24px; width: 40px; height: 120px; pointer-events: none; }
  .cig .smoke i {
    position: absolute; bottom: 0; left: 0; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(236, 232, 232, .18); filter: blur(6px); opacity: 0;
    animation: rise 6s ease-out infinite;
  }
  .cig .smoke i:nth-child(2) { animation-delay: 2s; left: 8px; }
  .cig .smoke i:nth-child(3) { animation-delay: 4s; left: -4px; }
  @keyframes glow { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  @keyframes rise {
    0% { transform: translate(0,0) scale(.6); opacity: 0; }
    20% { opacity: .7; }
    100% { transform: translate(30px,-120px) scale(2.6); opacity: 0; }
  }

  /* Sections */
  section { padding: 56px 0; border-top: 1px solid var(--line); }
  h2 {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-weight: 400;
    font-size: 2rem;
    margin: 0 0 8px;
  }
  .sub { color: var(--muted); margin: 0 0 28px; }

  /* Sections that keep the original colors (Who He Is, Equipment) */
  .orig { color: var(--o-newsprint); }
  .orig .sub { color: var(--o-muted); }

  /* Tally */
  .tally { display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }
  .tally b { font-family: 'Special Elite', monospace; font-weight: 400; font-size: 5rem; line-height: 1; color: var(--ember); min-width: 1.5ch; }
  .btns { display: flex; gap: 12px; }
  .btns button {
    font-family: 'Special Elite', 'Courier New', monospace; font-size: 1.1rem;
    background: var(--o-ember); color: var(--o-ink); border: 2px solid var(--o-ember);
    padding: 10px 22px; cursor: pointer;
  }
  .btns button.ghost { background: transparent; color: var(--o-newsprint); border-color: var(--o-trench); }
  .btns button:focus-visible { outline: 3px solid var(--o-newsprint); outline-offset: 2px; }

  /* Prose */
  .prose p { max-width: 62ch; margin: 0 0 1.1em; }

  /* Tabs */
  [hidden] { display: none !important; }
  .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-top: 8px; }
  .tabs button {
    font-family: 'Special Elite', 'Courier New', monospace; font-size: 1.15rem;
    color: var(--o-muted); background: none; border: 0; border-bottom: 3px solid transparent;
    padding: 12px 18px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--o-newsprint); border-bottom-color: var(--o-ember); }
  .tabs button:focus-visible { outline: 3px solid var(--o-newsprint); outline-offset: -3px; }
  .panel > section:first-child { border-top: 0; }

  /* Equipment */
  .gear { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .gear li { background: var(--o-smoke); padding: 16px 18px; border-left: 4px solid var(--o-ember); }
  .gear strong { display: block; font-weight: 600; }
  .gear span { color: var(--o-muted); font-size: 1.05rem; line-height: 1.5; display: block; }

  footer { padding: 36px 0 56px; border-top: 1px solid var(--line); color: var(--muted); font-size: 1rem; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .cig .ember, .cig .smoke i
